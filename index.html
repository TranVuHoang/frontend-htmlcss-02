<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- box icons cdn -->
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <!-- google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=MuseoModerno:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="icon" href="./images/main1.png" />

    <!-- style css -->
    <link rel="stylesheet" href="./css/style.css" />
    <title>Hwang Tran - Responsive Website Using HTML & CSS</title>
  </head>
  <body>
    <!-- header section start -->
    <header class="header">
      <a href="#!" class="logo">
        <i class="bx bx-stopwatch"></i>
        <span>Honor</span>
      </a>

      <ul class="navList">
        <li><a href="#!" class="active">Home</a></li>
        <li><a href="#!">About</a></li>
        <li><a href="#!">Smartphone</a></li>
        <li><a href="#!">Store</a></li>
        <li><a href="#!">Contact Us</a></li>
      </ul>

      <div class="h-main">
        <a href="#!" class="h-btn">Buy Now</a>
        <i id="menu-icon" class="bx bx-menu"></i>
        <i id="darkMode" class="bx bx-moon"></i>
      </div>
    </header>
    <!-- header section end -->

    <!-- hero section start -->
    <section class="hero">
      <div class="hero__text">
        <h1 class="hero__title">Smartwatch</h1>
        <h4>Element Series</h4>
        <p>
          Lorem ipsum dolor sit amet, consectetur adipisicing elit. Officiis
          perferendis maiores, harum veniam ducimus perspiciatis atque!
        </p>
        <div class="hero__in">
          <div class="box">
            <h3>white</h3>
            <h5>Element</h5>
            <img src="./images/main1.png" alt="" />
          </div>

          <div class="box">
            <h3>white</h3>
            <h5>Element</h5>
            <img src="./images/main2.png" alt="" />
          </div>

          <div class="box">
            <h3>white</h3>
            <h5>Element</h5>
            <img src="./images/main1.png" alt="" />
          </div>
        </div>
      </div>

      <div class="hero__img">
        <img src="./images/hero.png" alt="" />
      </div>
    </section>

    <div class="down-arrow">
      <i class="bx bx-down-arrow-alt"></i>
    </div>
    <!-- hero section end -->

    <!-- main js -->
    <script src="./js/main.js"></script>
  </body>
</html>
